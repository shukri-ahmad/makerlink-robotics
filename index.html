<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Dashboard | UTHM Makerspace</title>
    <style>
        :root {
            --primary: #22c55e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .header h1 { margin: 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
        
        button { cursor: pointer; padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-connect { background-color: var(--primary); color: #000; }
        .btn-connect:hover { background-color: #16a34a; }
        .btn-disconnect { background-color: var(--danger); color: #fff; display: none; }
        
        #dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        
        .val-display { font-size: 1.5rem; font-weight: bold; text-align: right; }
        
        input[type="range"] { width: 100%; margin: 15px 0; accent-color: var(--primary); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; background-color: #334155; color: white; border: 1px solid #475569; }
        .btn-group button:hover { background-color: #475569; }

        .progress-bar { width: 100%; background-color: #334155; border-radius: 99px; height: 20px; overflow: hidden; margin-top: 15px; }
        .progress-fill { background-color: var(--primary); height: 100%; width: 0%; transition: 0.1s linear; }

        .digital-indicator { width: 28px; height: 28px; border-radius: 50%; background-color: #334155; margin-left: auto; transition: 0.2s; }
        .digital-indicator.active { background-color: var(--primary); box-shadow: 0 0 12px var(--primary); }
        
        #status { font-size: 0.95rem; color: var(--text-muted); font-weight: normal; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📡 MakerLink Dashboard <span id="status">(Disconnected)</span></h1>
        <div>
            <button id="btnConnect" class="btn-connect">Connect micro:bit</button>
            <button id="btnDisconnect" class="btn-disconnect">Disconnect</button>
        </div>
    </div>

    <!-- Cards automatically build here -->
    <div id="dashboard"></div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bleDevice, rxCharacteristic, txCharacteristic;
        let receiveBuffer = "";

        // Attach event listeners explicitly after DOM loads
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('btnConnect').addEventListener('click', connect);
            document.getElementById('btnDisconnect').addEventListener('click', disconnect);
        });

        async function connect() {
            if (!navigator.bluetooth) {
                alert("Web Bluetooth is not supported on this browser. Please use Google Chrome or Microsoft Edge.");
                return;
            }

            try {
                document.getElementById('status').innerText = "(Scanning...)";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', disconnect);

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHAR_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                document.getElementById('btnConnect').style.display = 'none';
                document.getElementById('btnDisconnect').style.display = 'inline-block';
                document.getElementById('status').innerText = `(Connected: ${bleDevice.name})`;
                document.getElementById('status').style.color = "var(--primary)";
                
                document.getElementById('dashboard').innerHTML = "";

            } catch (error) {
                console.error("Bluetooth Error:", error);
                document.getElementById('status').innerText = "(Connection Cancelled or Failed)";
                document.getElementById('status').style.color = "var(--danger)";
            }
        }

        function disconnect() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            document.getElementById('btnConnect').style.display = 'inline-block';
            document.getElementById('btnDisconnect').style.display = 'none';
            document.getElementById('status').innerText = "(Disconnected)";
            document.getElementById('status').style.color = "var(--text-muted)";
        }

        async function sendCommand(id, value) {
            if (!rxCharacteristic) return;
            const cmd = `${id}:${value}\n`;
            const encoder = new TextEncoder();
            try {
                await rxCharacteristic.writeValue(encoder.encode(cmd));
            } catch (error) {
                console.error("Write Error:", error);
            }
        }

        function handleIncomingData(event) {
            const decoder = new TextDecoder();
            const chunk = decoder.decode(event.target.value);
            receiveBuffer += chunk;

            let lines = receiveBuffer.split("\n");
            receiveBuffer = lines.pop();

            for (let line of lines) {
                parseMessage(line.trim());
            }
        }

        function parseMessage(line) {
            if (!line) return;
            
            let parts = line.split(":");
            if (parts.length < 2) return;

            let id = parts[0];
            let payload = parts[1];

            if (id === "INIT") {
                let initData = payload.split(",");
                createCard(initData);
                return;
            }

            let val = parseInt(payload);
            let valDisplay = document.getElementById(`${id}-val`);
            
            if (id.startsWith("M") || id.startsWith("S")) {
                let slider = document.getElementById(`${id}-slider`);
                if (slider && valDisplay) {
                    slider.value = val;
                    valDisplay.innerText = id.startsWith("S") ? `${val}°` : val;
                }
            } else if (id.startsWith("P")) {
                let progress = document.getElementById(`${id}-progress`);
                if (progress && valDisplay) {
                    valDisplay.innerText = val;
                    progress.style.width = (val / 1023 * 100) + "%";
                }
                let indicator = document.getElementById(`${id}-indicator`);
                if (indicator) {
                    if (val === 1) indicator.classList.add('active');
                    else indicator.classList.remove('active');
                }
            }
        }

        function createCard(data) {
            const id = data[0];
            const type = data[1];
            
            if(document.getElementById(`card-${id}`)) return; 

            const dash = document.getElementById('dashboard');
            let card = document.createElement('div');
            card.className = "card";
            card.id = `card-${id}`;

            let html = `<div class="card-header"><span>${id} (${type})</span></div>`;

            if (type === "MOTOR") {
                let start = data[2], cw = data[3], ccw = data[4];
                html += `
                    <div class="val-display" id="${id}-val">${start}</div>
                    <input type="range" id="${id}-slider" min="${ccw}" max="${cw}" value="${start}" 
                           oninput="document.getElementById('${id}-val').innerText=this.value; sendCommand('${id}', this.value)">
                    <div class="btn-group">
                        <button onclick="document.getElementById('${id}-slider').value=0; sendCommand('${id}', 0); document.getElementById('${id}-val').innerText=0;">STOP</button>
                    </div>`;
            } 
            else if (type === "SERVO") {
                let start = data[2], pos1 = data[3], pos2 = data[4];
                html += `
                    <div class="val-display" id="${id}-val">${start}°</div>
                    <input type="range" id="${id}-slider" min="0" max="180" value="${start}" 
                           oninput="document.getElementById('${id}-val').innerText=this.value+'°'; sendCommand('${id}', this.value)">
                    <div class="btn-group">
                        <button onclick="document.getElementById('${id}-slider').value=${pos1}; sendCommand('${id}', ${pos1}); document.getElementById('${id}-val').innerText='${pos1}°';">Pos 1 (${pos1}°)</button>
                        <button onclick="document.getElementById('${id}-slider').value=${pos2}; sendCommand('${id}', ${pos2}); document.getElementById('${id}-val').innerText='${pos2}°';">Pos 2 (${pos2}°)</button>
                    </div>`;
            } 
            else if (type === "IN" || type === "OUT") {
                let pinNum = parseInt(id.replace("P", ""));
                if (pinNum <= 2) {
                    html += `
                        <div class="val-display" id="${id}-val">${data[2]}</div>
                        <div class="progress-bar"><div class="progress-fill" id="${id}-progress"></div></div>`;
                } else {
                    html += `<div class="digital-indicator" id="${id}-indicator"></div>`;
                }
            }

            card.innerHTML = html;
            dash.appendChild(card);
        }
    </script>
</body>
</html>
