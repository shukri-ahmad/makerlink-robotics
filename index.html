<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Host</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; }
        
        body.is-editing .ui-editable { border-bottom: 1px dashed #facc15; border-radius: 0; transition: border 0.2s; cursor: text !important; }
        body:not(.is-editing) .ui-editable { border-bottom: 1px solid transparent; }
        
        body:not(.is-editing) .maker-card { cursor: default; }
        body.is-editing .maker-card { cursor: grab; }
        body.is-editing .maker-card:active { cursor: grabbing; }
        
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        #terminal-output::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-track { background: #0f172a; }
        #terminal-output::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .maker-card { width: 280px; height: 340px; flex-shrink: 0; display: flex; flex-direction: column; }
        .sortable-ghost { opacity: 0.4; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden relative">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 opacity-0 pointer-events-none font-bold text-center border-2 border-red-400">Message</div>

    <header class="flex flex-col xl:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6 gap-6 xl:gap-0 shrink-0">
        <div class="flex items-center gap-4">
            <img src="MAKEROBOT_ECO-Photoroom.jpg" alt="Makerobot Ecosystem" class="h-14 md:h-16 object-contain rounded-lg shadow-md mix-blend-screen">
            <div class="flex flex-col justify-center">
                <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 leading-tight">MakerLink Host</h1>
                <p class="text-emerald-400 text-sm font-bold tracking-wide mt-1">Simplifying cyber-physical prototyping</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 justify-center">
            <button id="btnConnect" onclick="connectBluetooth()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-lg">🔌 Connect</button>
            <button id="btn-edit" onclick="toggleEditMode()" class="bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">🔒 Lock UI</button>
            <button id="btn-cloud" onclick="toggleCloud()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg">☁️ Go Public</button>
            <button id="btn-clear" onclick="clearDashboard()" class="bg-red-900 hover:bg-red-800 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[130px] shadow-lg">🗑️ Clear</button>
        </div>
    </header>

    <div class="flex flex-col gap-8 flex-1 pb-20">
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg flex flex-col mb-2">
            <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">💻 System Terminal</h3>
                <button onclick="document.getElementById('terminal-output').innerHTML='<div class=\'text-slate-600 italic\'>Logs cleared.</div>'" class="text-[10px] font-bold bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-slate-300 transition-colors shadow-inner">CLEAR</button>
            </div>
            <div id="terminal-output" class="p-3 h-32 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1 bg-[#0a0f18] rounded-b-xl break-words shadow-inner">
                <div class="text-slate-600 italic">Waiting for micro:bit SYNC...</div>
            </div>
        </div>

        <div id="dashboard-grid" class="flex flex-wrap gap-6 justify-center sm:justify-start"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik",
            authDomain: "makerlink-b575b.firebaseapp.com",
            databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "makerlink-b575b",
            storageBucket: "makerlink-b575b.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isCloudActive = false, cloudRoomId = null, cloudInterval = null;
        let isEditMode = false;
        
        const advancedData = {};
        const sensorCharts = {};
        const maxDataPoints = {};
        let activeCardTypes = {}; 

        let bluetoothDevice, bluetoothServer, uartService, rxCharacteristic, txCharacteristic;
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let rxBuffer = '';
        let commandQueue = [];
        let isTransmitting = false;

        const gridEl = document.getElementById('dashboard-grid');
        const sortable = new Sortable(gridEl, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            disabled: true, 
            onEnd: function (evt) { saveLayoutOrder(); }
        });

        function saveLayoutOrder() {
            const order = Array.from(gridEl.children).map(c => c.id.replace('card-', ''));
            localStorage.setItem('makerlink_layout', JSON.stringify(order));
            if (isCloudActive && cloudRoomId) { db.ref('rooms/' + cloudRoomId + '/layout').set(order); }
        }

        function applySavedLayout() {
            const saved = JSON.parse(localStorage.getItem('makerlink_layout') || '[]');
            saved.forEach(id => {
                const card = document.getElementById(`card-${id}`);
                if (card) { gridEl.appendChild(card); }
            });
        }

        function showMsg(msg) {
            const box = document.getElementById('msg-box');
            box.innerText = msg;
            box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100');
            setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000);
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

        function appendTerminal(msg) {
            const term = document.getElementById('terminal-output');
            if (term.innerHTML.includes("Waiting for micro:bit SYNC...")) term.innerHTML = '';
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const line = document.createElement('div');
            let colorClass = msg.toLowerCase().includes('error') || msg.toLowerCase().includes('fail') ? 'text-red-400' : 'text-emerald-400';
            line.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> <span class="${colorClass}">${escapeHTML(msg)}</span>`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;

            if (isCloudActive && cloudRoomId) {
                db.ref('rooms/' + cloudRoomId + '/logs').push({ time: time, msg: msg, color: colorClass });
            }
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            sortable.option("disabled", !isEditMode); 
            
            const btn = document.getElementById('btn-edit');
            if (isEditMode) {
                document.body.classList.add('is-editing');
                btn.innerHTML = "🔓 Edit UI (Drag enabled)";
                btn.className = "bg-yellow-500 hover:bg-yellow-400 text-yellow-950 font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-[0_0_15px_rgba(234,179,8,0.4)]";
                document.querySelectorAll('.ui-editable').forEach(el => el.removeAttribute('readonly'));
            } else {
                document.body.classList.remove('is-editing');
                btn.innerHTML = "🔒 Lock UI";
                btn.className = "bg-slate-600 hover:bg-slate-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                document.querySelectorAll('.ui-editable').forEach(el => el.setAttribute('readonly', true));
            }
        }

        function clearDashboard() {
            gridEl.innerHTML = '';
            activeCardTypes = {};
            localStorage.removeItem('makerlink_layout');
            appendTerminal("Dashboard cleared manually.");
        }

        // --- NEW NATIVE RED/BLACK DIGITAL UPDATER ---
        function updateDigitalUI(id, val) {
            let v = Number(val);
            advancedData[id] = v;
            
            // Input Indicator LED
            let valIn = document.getElementById(`val-${id}`);
            if(valIn) {
                valIn.innerText = v === 1 ? 'HIGH' : 'LOW';
                valIn.className = v === 1 ? "w-24 h-24 rounded-full flex items-center justify-center text-2xl font-bold transition-all duration-200 bg-red-600 text-white shadow-[0_0_25px_rgba(220,38,38,0.8)] border-[4px] border-red-400" 
                                          : "w-24 h-24 rounded-full flex items-center justify-center text-2xl font-bold transition-all duration-200 bg-slate-900 text-slate-500 shadow-inner border-[4px] border-slate-800";
            }
            
            // Output Status LED
            let valOut = document.getElementById(`val-out-${id}`);
            if(valOut) {
                valOut.className = v === 1 ? "w-12 h-12 mb-6 rounded-full transition-all duration-200 bg-red-600 shadow-[0_0_20px_rgba(220,38,38,0.8)] border-[3px] border-red-400"
                                           : "w-12 h-12 mb-6 rounded-full transition-all duration-200 bg-slate-900 shadow-inner border-[3px] border-slate-800";
            }
        }

        function createPlayingCard(id, type, mode, startVals) {
            if(document.getElementById(`card-${id}`)) return; 

            activeCardTypes[id] = { type: type, mode: mode };
            advancedData[id] = startVals ? startVals[0] : 0;
            if(type === 'analog') maxDataPoints[id] = 20;

            const card = document.createElement('div');
            card.className = "maker-card bg-slate-800 rounded-xl border border-slate-700 shadow-lg hover:border-slate-500/50 transition-colors";
            card.id = `card-${id}`;

            let colorClass = type === 'analog' ? 'text-purple-400' : type === 'digital' ? 'text-emerald-400' : type === 'motor' ? 'text-orange-400' : type === 'text' ? 'text-pink-400' : 'text-blue-400';
            let iconStr = type === 'analog' ? '📊' : type === 'digital' ? '🚥' : type === 'motor' ? '⚙️' : type === 'text' ? '📝' : '🦾';

            let html = `
                <div class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
                    <div class="flex items-center gap-2"><span class="font-bold text-sm ${colorClass}">${id}</span><span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700">${iconStr} ${mode ? mode : type.toUpperCase()}</span></div>
                </div><div class="p-4 flex-1 flex flex-col items-center justify-center bg-slate-800">
            `;

            if (type === 'analog' && mode === 'IN') {
                html += `<div id="val-${id}" class="text-4xl font-mono ${colorClass} font-bold mb-2">0</div><div class="w-full flex-1 bg-slate-900 rounded-lg p-1 border border-slate-700 min-h-[100px] mb-2"><canvas id="chart-${id}"></canvas></div><div class="flex gap-2 w-full mt-auto"><div class="flex-1 flex flex-col"><label class="text-[9px] text-slate-500 text-center font-bold">MIN</label><input type="number" id="ymin-${id}" value="0" onchange="updateSensorChartConfig('${id}')" class="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-center text-xs font-mono text-slate-300"></div><div class="flex-1 flex flex-col"><label class="text-[9px] text-slate-500 text-center font-bold">MAX</label><input type="number" id="ymax-${id}" value="1023" onchange="updateSensorChartConfig('${id}')" class="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-center text-xs font-mono text-slate-300"></div><div class="flex-1 flex flex-col"><label class="text-[9px] text-slate-500 text-center font-bold">PTS</label><input type="number" id="xmax-${id}" value="20" onchange="updateSensorChartConfig('${id}')" class="w-full bg-slate-900 border border-slate-600 rounded px-1 py-1 text-center text-xs font-mono text-slate-300"></div></div>`;
            } 
            else if (type === 'analog' && mode === 'OUT') {
                html += `<div id="val-out-${id}" class="text-5xl font-mono ${colorClass} font-bold mb-8">${startVals[0]}</div><input type="range" id="slider-${id}" min="0" max="1023" value="${startVals[0]}" oninput="document.getElementById('val-out-${id}').innerText=this.value; sendBluetoothCommand('${id}:'+this.value);" class="w-full mb-2 mt-auto"><div class="flex justify-between w-full text-xs text-slate-500 font-mono"><span>0</span><span>1023</span></div>`;
            } 
            else if (type === 'digital' && mode === 'IN') {
                html += `<div id="val-${id}" class="w-24 h-24 rounded-full flex items-center justify-center text-2xl font-bold transition-all duration-200 bg-slate-900 text-slate-500 shadow-inner border-[4px] border-slate-800">LOW</div>`;
            } 
            else if (type === 'digital' && mode === 'OUT') {
                html += `<div id="val-out-${id}" class="w-12 h-12 mb-6 rounded-full transition-all duration-200 bg-slate-900 shadow-inner border-[3px] border-slate-800"></div>
                         <div class="flex justify-between gap-3 w-full mt-auto">
                             <button onclick="sendBluetoothCommand('${id}:0')" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-400 font-bold text-lg shadow-lg active:bg-slate-600 transition-all border border-slate-700">OFF</button>
                             <button onclick="sendBluetoothCommand('${id}:1')" class="flex-1 py-4 bg-red-600 hover:bg-red-500 rounded-lg text-white font-bold text-lg shadow-lg active:bg-red-700 transition-all border border-red-500">ON</button>
                         </div>`;
            } 
            else if (type === 'text') {
                html += `<div id="val-${id}" class="w-full h-full flex items-center justify-center text-center text-2xl font-bold text-pink-400 break-words">${startVals[0]}</div>`;
            }
            else if (type === 'motor') {
                html += `<div id="val-${id}" class="text-xl font-mono text-orange-400 font-bold mb-4 w-full text-center bg-slate-900 py-3 rounded-lg border border-slate-700 shadow-inner">STOP (0)</div><div class="flex gap-2 w-full mb-6"><div class="flex-1 flex flex-col"><label class="text-[10px] text-slate-400 mb-1 text-center font-bold">CCW SPEED</label><input type="number" id="ccw-spd-${id}" value="255" class="w-full bg-slate-900 border border-slate-600 rounded-md px-1 py-2 text-center text-sm font-mono text-orange-400 shadow-inner"></div><div class="flex-1 flex flex-col"><label class="text-[10px] text-slate-400 mb-1 text-center font-bold">CW SPEED</label><input type="number" id="cw-spd-${id}" value="255" class="w-full bg-slate-900 border border-slate-600 rounded-md px-1 py-2 text-center text-sm font-mono text-orange-400 shadow-inner"></div></div><div class="flex gap-2 w-full mt-auto"><button onclick="setMotor('${id}', 'ccw')" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg transition-colors border border-yellow-700/50 cursor-pointer">⏪ CCW</button><button onclick="setMotor('${id}', 'stop')" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg transition-colors border border-red-700/50 cursor-pointer">⏹️ STOP</button><button onclick="setMotor('${id}', 'cw')" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg transition-colors border border-green-700/50 cursor-pointer">CW ⏩</button></div>`;
            } 
            else if (type === 'servo') {
                html += `<div id="val-${id}" class="text-4xl font-mono text-blue-400 font-bold mb-6">${startVals[0]}°</div><input type="range" id="slider-${id}" min="0" max="180" value="${startVals[0]}" oninput="updateVal('${id}', this.value); sendBluetoothCommand('${id}:'+this.value);" class="w-full mb-6 mt-auto"><div class="flex gap-3 w-full"><div class="flex-1 flex flex-col gap-2"><input type="number" id="pos1-val-${id}" value="${startVals[1]}" class="w-full bg-slate-900 border border-slate-600 rounded-md px-1 py-2 text-center text-sm font-mono text-blue-400 shadow-inner"><button onclick="setServoPos('${id}', 1)" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg border border-blue-700/50">Pos 1</button></div><div class="flex-1 flex flex-col gap-2"><input type="number" id="pos2-val-${id}" value="${startVals[2]}" class="w-full bg-slate-900 border border-slate-600 rounded-md px-1 py-2 text-center text-sm font-mono text-blue-400 shadow-inner"><button onclick="setServoPos('${id}', 2)" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded-lg shadow-lg border border-blue-700/50">Pos 2</button></div></div>`;
            }

            html += `</div><div class="p-2 bg-slate-900 border-t border-slate-700 rounded-b-xl flex justify-center"><input type="text" id="title-${id}" value="Custom Label" readonly class="ui-editable font-bold text-xs text-slate-400 bg-transparent border-none outline-none focus:ring-1 focus:ring-slate-500 rounded w-full text-center placeholder-slate-500 cursor-default" placeholder="Name this card..."></div>`;

            card.innerHTML = html;
            gridEl.appendChild(card);
            
            if (type === 'analog' && mode === 'IN') initSensorChart(id);
            applySavedLayout();
            saveLayoutOrder(); 
        }

        function initSensorChart(id) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            sensorCharts[id] = new Chart(ctx, {
                type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.2, pointRadius: 0, borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 1023, border: {display: false}, grid: {color: '#334155', drawBorder: false} } } }
            });
        }

        function updateSensorChartConfig(id) {
            const yMin = parseFloat(document.getElementById(`ymin-${id}`).value) || 0;
            const yMax = parseFloat(document.getElementById(`ymax-${id}`).value) || 1023;
            maxDataPoints[id] = parseInt(document.getElementById(`xmax-${id}`).value) || 20;
            if(sensorCharts[id]) { sensorCharts[id].options.scales.y.min = yMin; sensorCharts[id].options.scales.y.max = yMax; sensorCharts[id].update(); }
        }
        
        function pushSensorData(id, val) {
            if(!sensorCharts[id]) return;
            const chart = sensorCharts[id]; const maxPts = maxDataPoints[id] || 20;
            chart.data.labels.push(''); chart.data.datasets[0].data.push(val);
            if(chart.data.labels.length > maxPts) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();
        }

        function updateVal(id, val) { document.getElementById(`val-${id}`).innerText = val + (id.startsWith('S') ? '°' : ''); advancedData[id] = Number(val); }

        function setServoPos(id, posNum) {
            let val = parseInt(document.getElementById(`pos${posNum}-val-${id}`).value) || 0;
            if (val > 180) val = 180; if (val < 0) val = 0;
            const slider = document.getElementById(`slider-${id}`); if (slider) slider.value = val;
            updateVal(id, val); sendBluetoothCommand(`${id}:${val}`);
        }

        function setMotor(id, action) {
            let val = 0;
            if (action === 'ccw') { let spd = parseInt(document.getElementById(`ccw-spd-${id}`).value) || 0; val = -(spd > 255 ? 255 : (spd < 0 ? 0 : spd)); } 
            else if (action === 'cw') { let spd = parseInt(document.getElementById(`cw-spd-${id}`).value) || 0; val = (spd > 255 ? 255 : (spd < 0 ? 0 : spd)); }
            let displayStr = val > 0 ? `CW (${val})` : (val < 0 ? `CCW (${val})` : 'STOP (0)');
            document.getElementById(`val-${id}`).innerText = displayStr; advancedData[id] = val; sendBluetoothCommand(`${id}:${val}`);
        }

        async function sendBluetoothCommand(cmd) {
            if (!txCharacteristic) { console.log(`[Simulated TX] ${cmd}`); return; }
            commandQueue.push(cmd); processCommandQueue();
        }

        async function processCommandQueue() {
            if (isTransmitting || commandQueue.length === 0) return;
            isTransmitting = true; const cmd = commandQueue.shift();
            try {
                let data = new TextEncoder().encode(cmd + '\n');
                if (txCharacteristic.properties.writeWithoutResponse) { await txCharacteristic.writeValueWithoutResponse(data); } 
                else { await txCharacteristic.writeValue(data); }
            } catch (err) { console.error("TX Queue Error:", err); } 
            finally { isTransmitting = false; if (commandQueue.length > 0) { setTimeout(processCommandQueue, 10); } }
        }

        async function connectBluetooth() {
            if (!navigator || !navigator.bluetooth) { showMsg("Web Bluetooth API is missing! Use Chrome or Edge."); return; }
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'BBC micro:bit' }], optionalServices: [UART_SERVICE_UUID] });
                bluetoothServer = await bluetoothDevice.gatt.connect();
                uartService = await bluetoothServer.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await uartService.getCharacteristic(UART_TX_CHAR_UUID);
                rxCharacteristic = await uartService.getCharacteristic(UART_RX_CHAR_UUID);
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

                const btn = document.getElementById("btnConnect");
                btn.innerHTML = "✅ Connected"; btn.classList.replace("bg-blue-600", "bg-green-600"); btn.classList.replace("hover:bg-blue-500", "hover:bg-green-500");

                setTimeout(() => { 
                    sendBluetoothCommand('SYNC'); 
                    appendTerminal("Bluetooth connected. Sent SYNC to hardware."); 
                }, 300);

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    const btn = document.getElementById("btnConnect");
                    btn.innerHTML = "🔌 Connect"; btn.classList.replace("bg-green-600", "bg-blue-600"); btn.classList.replace("hover:bg-green-500", "hover:bg-blue-500");
                    showMsg("Micro:bit disconnected!");
                    appendTerminal("Error: Bluetooth connection lost.");
                });
            } catch (error) { showMsg("Connection failed or cancelled. Check console (F12) for details."); }
        }

        function handleIncomingData(event) {
            let value = new TextDecoder().decode(event.target.value);
            rxBuffer += value; 
            let lines = rxBuffer.split('\n');
            while(lines.length > 1) { 
                let line = lines.shift().trim();
                if (line.startsWith("LOG:")) { appendTerminal(line.substring(4)); } 
                else if (line.startsWith("INIT:")) {
                    let params = line.substring(5).split(",");
                    let id = params[0];
                    if(id.startsWith("M")) createPlayingCard(id, 'motor', null, [params[2], params[3], params[4]]);
                    else if(id.startsWith("S")) createPlayingCard(id, 'servo', null, [params[2], params[3], params[4]]);
                    else if(id.startsWith("T")) createPlayingCard(id, 'text', null, [params[2]]);
                    else if(id.startsWith("A")) createPlayingCard(id, 'analog', params[1], [params[2]]);
                    else if(id.startsWith("D")) createPlayingCard(id, 'digital', params[1], [params[2]]);
                }
                else if (line !== "") { parseTelemetry(line); }
            }
            rxBuffer = lines[0];
        }

        function parseTelemetry(str) {
            let splitIdx = str.indexOf(':');
            if(splitIdx === -1) return;
            let id = str.substring(0, splitIdx);
            let valStr = str.substring(splitIdx + 1);

            let cardData = activeCardTypes[id];
            if (!cardData) return; 
            
            advancedData[id] = valStr;

            if (cardData.type === 'text') {
                let el = document.getElementById(`val-${id}`);
                if(el) el.innerText = valStr;
            } 
            else {
                let val = parseFloat(valStr);
                if (cardData.type === 'analog' && cardData.mode === 'IN') {
                    let el = document.getElementById(`val-${id}`);
                    if(el) { el.innerText = val; pushSensorData(id, val); }
                } 
                else if (cardData.type === 'analog' && cardData.mode === 'OUT') {
                    let el = document.getElementById(`slider-${id}`);
                    if(el) el.value = val;
                    let elOut = document.getElementById(`val-out-${id}`);
                    if(elOut) elOut.innerText = val;
                }
                else if (cardData.type === 'digital') {
                    updateDigitalUI(id, val);
                }
                else if (cardData.type === 'motor') {
                    let el = document.getElementById(`val-${id}`);
                    if (el) {
                        let displayStr = val > 0 ? `CW (${val})` : (val < 0 ? `CCW (${val})` : 'STOP (0)');
                        el.innerText = displayStr;
                    }
                }
                else if (cardData.type === 'servo') {
                    let el = document.getElementById(`slider-${id}`);
                    if(el) el.value = val;
                    let valEl = document.getElementById(`val-${id}`);
                    if(valEl) valEl.innerText = val + '°';
                }
            }
        }

        function toggleCloud() {
            isCloudActive = !isCloudActive; const btn = document.getElementById('btn-cloud');
            if (isCloudActive) {
                cloudRoomId = Math.floor(1000 + Math.random() * 9000);
                btn.innerHTML = `🔴 Live: Room ${cloudRoomId}`; 
                btn.className = "bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] animate-pulse shadow-[0_0_15px_rgba(220,38,38,0.5)]";
                
                db.ref('rooms/' + cloudRoomId).remove(); 
                saveLayoutOrder(); 
                
                db.ref('rooms/' + cloudRoomId + '/command').on('child_added', (snap) => {
                    const cmdData = snap.val();
                    if(cmdData && cmdData.cmd) { sendBluetoothCommand(cmdData.cmd); parseTelemetry(cmdData.cmd); }
                });

                cloudInterval = setInterval(syncCloud, 400); 
                appendTerminal(`Cloud stream active. Room ID: ${cloudRoomId}`);
            } else {
                btn.innerHTML = `☁️ Go Public`; btn.className = "bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded-lg transition-colors min-w-[140px] shadow-lg";
                clearInterval(cloudInterval);
                if(cloudRoomId) { db.ref('rooms/' + cloudRoomId).remove(); }
                appendTerminal("Cloud stream closed.");
            }
        }

        function syncCloud() {
            const payload = [];
            Array.from(gridEl.children).forEach(cardDom => {
                let id = cardDom.id.replace('card-', '');
                let info = activeCardTypes[id];
                if(info) {
                    let titleInput = document.getElementById(`title-${id}`);
                    let cardData = { id: id, type: info.type, mode: info.mode, val: advancedData[id], label: titleInput ? titleInput.value : "Label" };
                    if (info.type === 'servo') {
                        cardData.pos1Val = document.getElementById(`pos1-val-${id}`)?.value || 0;
                        cardData.pos2Val = document.getElementById(`pos2-val-${id}`)?.value || 180;
                    }
                    payload.push(cardData);
                }
            });
            db.ref('rooms/' + cloudRoomId + '/state').set(payload).catch((e) => console.error(e));
        }
    </script>
</body>
</html>
