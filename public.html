<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Public Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; }
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
        #terminal-output::-webkit-scrollbar { width: 6px; }
        #terminal-output::-webkit-scrollbar-track { background: #0f172a; }
        #terminal-output::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .maker-card { width: 280px; height: 340px; flex-shrink: 0; display: flex; flex-direction: column; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden relative">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-purple-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 opacity-0 pointer-events-none font-bold text-center border-2 border-purple-400">Message</div>

    <header class="flex flex-col xl:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6 gap-6 xl:gap-0 shrink-0">
        <div class="flex items-center gap-4">
            <img src="MAKEROBOT_ECO-Photoroom.jpg" alt="Makerobot Ecosystem" class="h-14 md:h-16 object-contain rounded-lg shadow-md mix-blend-screen">
            <div class="flex flex-col justify-center">
                <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 leading-tight">MakerLink Public</h1>
            </div>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-center">
            <input type="number" id="room-input" placeholder="Room ID..." class="bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 font-mono text-white focus:outline-none focus:border-purple-500 w-full sm:w-32 text-center text-lg">
            <button id="btn-join" onclick="joinRoom()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-lg whitespace-nowrap">📡 Join</button>
        </div>
    </header>

    <div class="flex flex-col gap-8 flex-1 w-full pb-20">
        
        <div id="empty-state" class="w-full text-center text-slate-500 mt-20 font-bold flex flex-col items-center gap-4">
            <span class="text-6xl">📡</span>
            <p>Enter a Room ID to connect to a live MakerLink Host.</p>
        </div>

        <div id="section-terminal" class="hidden flex-col">
            <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg flex flex-col mb-2">
                <div class="p-3 border-b border-slate-700 flex justify-between items-center bg-slate-900/50 rounded-t-xl">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">💻 Host Terminal Stream</h3>
                </div>
                <div id="terminal-output" class="p-3 h-32 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1 bg-[#0a0f18] rounded-b-xl break-words shadow-inner">
                    <div class="text-slate-600 italic">Connected. Awaiting logs...</div>
                </div>
            </div>
        </div>

        <div id="dashboard-grid" class="hidden flex-wrap gap-6 justify-center sm:justify-start"></div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik",
            authDomain: "makerlink-b575b.firebaseapp.com",
            databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "makerlink-b575b",
            storageBucket: "makerlink-b575b.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = null;
        const sensorCharts = {};

        function showMsg(msg) {
            const box = document.getElementById('msg-box');
            box.innerText = msg;
            box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100');
            setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000);
        }

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

        function appendTerminal(msg, time, colorClass) {
            const term = document.getElementById('terminal-output');
            if (term.innerHTML.includes("Awaiting logs...")) term.innerHTML = '';
            const line = document.createElement('div');
            line.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> <span class="${colorClass || 'text-emerald-400'}">${escapeHTML(msg)}</span>`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        }

        function joinRoom() {
            const roomId = document.getElementById('room-input').value;
            if (!roomId) { showMsg("Please enter a valid Room ID."); return; }

            if(currentRoom) {
                db.ref('rooms/' + currentRoom + '/state').off();
                db.ref('rooms/' + currentRoom + '/logs').off();
                db.ref('rooms/' + currentRoom + '/layout').off();
            }
            
            currentRoom = roomId;
            const btn = document.getElementById('btn-join');
            btn.innerHTML = "✅ Connected";
            btn.classList.replace("bg-purple-600", "bg-green-600");
            btn.classList.replace("hover:bg-purple-500", "hover:bg-green-500");

            showMsg(`Joined Room ${roomId}`);
            document.getElementById('empty-state').innerHTML = `<span class="text-6xl text-purple-500 animate-pulse">⏳</span><p>Waiting for Host data...</p>`;
            document.getElementById('section-terminal').classList.add('hidden'); document.getElementById('section-terminal').classList.remove('flex');
            document.getElementById('dashboard-grid').classList.add('hidden'); document.getElementById('dashboard-grid').classList.remove('flex');

            db.ref('rooms/' + currentRoom + '/state').on('value', (snap) => {
                const data = snap.val();
                if(data) { renderSharedCards(data); } 
                else {
                    document.getElementById('empty-state').classList.remove('hidden');
                    document.getElementById('dashboard-grid').classList.add('hidden'); document.getElementById('dashboard-grid').classList.remove('flex');
                    document.getElementById('empty-state').innerHTML = `<span class="text-6xl">📡</span><p>Room ${roomId} is empty or closed.</p>`;
                }
            });

            db.ref('rooms/' + currentRoom + '/logs').on('child_added', (snap) => {
                const log = snap.val();
                if (log) appendTerminal(log.msg, log.time, log.color);
            });

            db.ref('rooms/' + currentRoom + '/layout').on('value', (snap) => {
                const layoutOrder = snap.val();
                if(layoutOrder && Array.isArray(layoutOrder)) {
                    const grid = document.getElementById('dashboard-grid');
                    layoutOrder.forEach(id => {
                        const card = document.getElementById(`public-card-${id}`);
                        if(card) grid.appendChild(card); 
                    });
                }
            });
        }

        function sendRemoteCommand(cmd) {
            if(!currentRoom) return;
            db.ref('rooms/' + currentRoom + '/command').push({ cmd: cmd, ts: Date.now() });
        }

        // --- BULLETPROOF JAVASCRIPT INLINE CSS FOR LEDS ---
        function updateDigitalUI(id, val) {
            let v = Number(val);
            let valIn = document.getElementById(`val-${id}`);
            if(valIn) {
                valIn.innerText = v === 1 ? 'HIGH' : 'LOW';
                if(v === 1) {
                    valIn.style.backgroundColor = '#dc2626'; // Red
                    valIn.style.color = '#ffffff';
                    valIn.style.borderColor = '#f87171';
                    valIn.style.boxShadow = '0 0 25px rgba(220, 38, 38, 0.8)';
                } else {
                    valIn.style.backgroundColor = '#0f172a'; // Black/Slate
                    valIn.style.color = '#64748b';
                    valIn.style.borderColor = '#1e293b';
                    valIn.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)';
                }
            }
            
            let valOut = document.getElementById(`val-out-${id}`);
            if(valOut) {
                if(v === 1) {
                    valOut.style.backgroundColor = '#dc2626'; // Red
                    valOut.style.borderColor = '#f87171';
                    valOut.style.boxShadow = '0 0 20px rgba(220, 38, 38, 0.8)';
                } else {
                    valOut.style.backgroundColor = '#0f172a'; // Black/Slate
                    valOut.style.borderColor = '#1e293b';
                    valOut.style.boxShadow = 'inset 0 4px 6px rgba(0, 0, 0, 0.6)';
                }
            }
        }

        function renderSharedCards(sharedCards) {
            const gridEl = document.getElementById('dashboard-grid');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('section-terminal').classList.remove('hidden'); document.getElementById('section-terminal').classList.add('flex');
            gridEl.classList.remove('hidden'); gridEl.classList.add('flex');
            
            const currentCardIds = sharedCards.map(c => `public-card-${c.id}`);
            document.querySelectorAll('[id^="public-card-"]').forEach(child => {
                if (!currentCardIds.includes(child.id)) child.remove();
            });

            sharedCards.forEach(card => {
                let cardEl = document.getElementById(`public-card-${card.id}`);
                
                if (!cardEl) {
                    cardEl = document.createElement('div');
                    cardEl.id = `public-card-${card.id}`;
                    cardEl.className = "maker-card bg-slate-800 rounded-xl border border-slate-700 shadow-lg";
                    
                    let colorClass = card.type === 'analog' ? 'text-purple-400' : card.type === 'digital' ? 'text-emerald-400' : card.type === 'motor' ? 'text-orange-400' : card.type === 'text' ? 'text-pink-400' : 'text-blue-400';
                    let iconStr = card.type === 'analog' ? '📊' : card.type === 'digital' ? '🚥' : card.type === 'motor' ? '⚙️' : card.type === 'text' ? '📝' : '🦾';

                    let html = `
                        <div class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
                            <div class="flex items-center gap-2"><span class="font-bold text-sm ${colorClass}">${card.id}</span><span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700">${iconStr} ${card.mode || card.type.toUpperCase()}</span></div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-center items-center bg-slate-800">
                    `;

                    if (card.type === 'analog' && card.mode === 'IN') {
                        html += `<div id="val-${card.id}" class="text-4xl font-mono ${colorClass} font-bold mb-2">0</div><div class="w-full flex-1 bg-slate-900 rounded-lg p-1 border border-slate-700 min-h-[100px]"><canvas id="chart-${card.id}"></canvas></div>`;
                    } else if (card.type === 'analog' && card.mode === 'OUT') {
                        html += `<div id="val-out-${card.id}" class="text-5xl font-mono ${colorClass} font-bold mb-8">0</div><input type="range" min="0" max="1023" value="0" oninput="document.getElementById('val-out-${card.id}').innerText=this.value; sendRemoteCommand('${card.id}:'+this.value);" class="w-full mb-2 mt-auto">`;
                    } else if (card.type === 'digital' && card.mode === 'IN') {
                        html += `<div id="val-${card.id}" class="w-24 h-24 rounded-full flex items-center justify-center text-2xl font-bold transition-all duration-200 border-[4px]">LOW</div>`;
                    } else if (card.type === 'digital' && card.mode === 'OUT') {
                        html += `<div id="val-out-${card.id}" class="w-12 h-12 mb-6 rounded-full transition-all duration-200 border-[3px]"></div><div class="flex justify-between gap-3 w-full mt-auto"><button onclick="sendRemoteCommand('${card.id}:0')" class="flex-1 py-4 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-400 font-bold text-lg shadow-lg border border-slate-700">OFF</button><button onclick="sendRemoteCommand('${card.id}:1')" class="flex-1 py-4 bg-red-600 hover:bg-red-500 rounded-lg text-white font-bold text-lg shadow-lg border border-red-500">ON</button></div>`;
                    } else if (card.type === 'text') {
                        html += `<div id="val-${card.id}" class="w-full h-full flex items-center justify-center text-center text-2xl font-bold text-pink-400 break-words"></div>`;
                    } else if (card.type === 'motor') {
                        html += `<div id="val-${card.id}" class="text-xl font-mono text-orange-400 font-bold mb-6 w-full text-center bg-slate-900 py-3 rounded-lg border border-slate-700 shadow-inner">STOP (0)</div><div class="flex gap-2 w-full mt-auto"><button onclick="sendRemoteCommand('${card.id}:-255')" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg">⏪ CCW</button><button onclick="sendRemoteCommand('${card.id}:0')" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg">⏹️ STOP</button><button onclick="sendRemoteCommand('${card.id}:255')" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-[10px] font-bold py-3 rounded-lg shadow-lg">CW ⏩</button></div>`;
                    } else if (card.type === 'servo') {
                        html += `<div id="val-${card.id}" class="text-4xl font-mono text-blue-400 font-bold mb-6">90°</div><input type="range" id="slider-${card.id}" min="0" max="180" value="90" oninput="document.getElementById('val-${card.id}').innerText=this.value+'°'; sendRemoteCommand('${card.id}:'+this.value);" class="w-full mb-6 mt-auto"><div class="flex gap-3 w-full"><button onclick="sendRemoteCommand('${card.id}:${card.pos1Val}')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg border border-blue-700/50">${card.pos1Lbl}</button><button onclick="sendRemoteCommand('${card.id}:${card.pos2Val}')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg border border-blue-700/50">${card.pos2Lbl}</button></div>`;
                    }

                    html += `</div><div class="p-2 bg-slate-900 border-t border-slate-700 rounded-b-xl flex justify-center text-xs font-bold text-slate-400 cursor-default">${card.label}</div>`;
                    cardEl.innerHTML = html;
                    gridEl.appendChild(cardEl);
                    if (card.type === 'analog' && card.mode === 'IN') initChart(card.id);
                    if (card.type === 'digital') updateDigitalUI(card.id, card.val || 0); // Guarantee proper initial state
                }

                if (card.type === 'text') {
                    let el = document.getElementById(`val-${card.id}`);
                    if(el) el.innerText = card.val;
                } else {
                    let valNum = parseFloat(card.val) || 0;
                    if (card.type === 'analog' && card.mode === 'IN') {
                        let el = document.getElementById(`val-${card.id}`);
                        if(el) { el.innerText = valNum; pushChartData(card.id, valNum); }
                    } else if (card.type === 'analog' && card.mode === 'OUT') {
                        let sl = document.getElementById(`slider-${card.id}`); if(sl) sl.value = valNum;
                        let out = document.getElementById(`val-out-${card.id}`); if(out) out.innerText = valNum;
                    } else if (card.type === 'digital') {
                        updateDigitalUI(card.id, valNum);
                    } else if (card.type === 'motor') {
                        let el = document.getElementById(`val-${card.id}`);
                        if (el) el.innerText = valNum > 0 ? `CW (${valNum})` : (valNum < 0 ? `CCW (${valNum})` : 'STOP (0)');
                    } else if (card.type === 'servo') {
                        let sl = document.getElementById(`slider-${card.id}`); if(sl) sl.value = valNum;
                        let vl = document.getElementById(`val-${card.id}`); if(vl) vl.innerText = valNum + '°';
                    }
                }
            });
        }

        function initChart(id) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            sensorCharts[id] = new Chart(ctx, {
                type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.2, pointRadius: 0, borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 1023, display: false } } }
            });
        }

        function pushChartData(id, val) {
            if(!sensorCharts[id]) return;
            const chart = sensorCharts[id]; chart.data.labels.push(''); chart.data.datasets[0].data.push(val);
            if(chart.data.labels.length > 20) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();
        }
    </script>
</body>
</html>
