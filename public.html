<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerLink Public Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #38bdf8; cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; }
        #msg-box { transition: opacity 0.3s, transform 0.3s; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col p-4 md:p-6 overflow-x-hidden">

    <div id="msg-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-purple-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 opacity-0 pointer-events-none font-bold text-center border-2 border-purple-400">Message</div>

    <header class="flex flex-col sm:flex-row justify-between items-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6 gap-4 shrink-0">
        <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">MakerLink Public</h1>
        <div class="flex items-center gap-2 w-full sm:w-auto">
            <input type="number" id="room-input" placeholder="Room ID..." class="bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 font-mono text-white focus:outline-none focus:border-purple-500 w-full sm:w-32 text-center text-lg">
            <button id="btn-join" onclick="joinRoom()" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-lg whitespace-nowrap">📡 Join</button>
        </div>
    </header>

    <div id="public-container" class="flex flex-wrap gap-4 items-start content-start flex-1 w-full justify-center sm:justify-start">
        <div class="w-full text-center text-slate-500 mt-20 font-bold flex flex-col items-center gap-4">
            <span class="text-6xl">📡</span>
            <p>Enter a Room ID to connect to a live MakerLink Host.</p>
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAMLoInCYEYyT97RtkjW6rnT0lKTu7_xik",
            authDomain: "makerlink-b575b.firebaseapp.com",
            databaseURL: "https://makerlink-b575b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "makerlink-b575b",
            storageBucket: "makerlink-b575b.firebasestorage.app",
            messagingSenderId: "982732228897",
            appId: "1:982732228897:web:2d01c60fa79bf6dca61660"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRoom = null;
        const sensorCharts = {};

        function showMsg(msg) {
            const box = document.getElementById('msg-box');
            box.innerText = msg;
            box.classList.remove('opacity-0', 'pointer-events-none'); box.classList.add('opacity-100');
            setTimeout(() => { box.classList.remove('opacity-100'); box.classList.add('opacity-0', 'pointer-events-none'); }, 4000);
        }

        function joinRoom() {
            const roomId = document.getElementById('room-input').value;
            if (!roomId) { showMsg("Please enter a valid Room ID."); return; }

            if(currentRoom) db.ref('rooms/' + currentRoom + '/state').off();
            
            currentRoom = roomId;
            const btn = document.getElementById('btn-join');
            btn.innerHTML = "✅ Connected";
            btn.classList.replace("bg-purple-600", "bg-green-600");
            btn.classList.replace("hover:bg-purple-500", "hover:bg-green-500");

            showMsg(`Joined Room ${roomId}`);
            document.getElementById('public-container').innerHTML = ""; 

            db.ref('rooms/' + currentRoom + '/state').on('value', (snap) => {
                const data = snap.val();
                if(data) {
                    renderSharedCards(data);
                } else {
                    document.getElementById('public-container').innerHTML = `<div class="w-full text-center text-slate-500 mt-20 font-bold">Room ${roomId} is empty or closed.</div>`;
                }
            });
        }

        function sendRemoteCommand(cmd) {
            if(!currentRoom) return;
            db.ref('rooms/' + currentRoom + '/command').set({
                cmd: cmd,
                ts: Date.now() 
            });
        }

        function renderSharedCards(sharedCards) {
            const container = document.getElementById('public-container');
            
            const currentCardIds = sharedCards.map(c => `public-card-${c.id}`);
            Array.from(container.children).forEach(child => {
                if (child.id && !currentCardIds.includes(child.id)) {
                    child.remove();
                }
            });

            sharedCards.forEach(card => {
                let cardEl = document.getElementById(`public-card-${card.id}`);
                
                if (!cardEl) {
                    cardEl = document.createElement('div');
                    cardEl.id = `public-card-${card.id}`;
                    cardEl.className = "bg-slate-800 rounded-xl border border-slate-700 overflow-hidden flex flex-col shadow-lg w-full sm:w-[320px] shrink-0";
                    
                    let bodyHTML = '';
                    let colorClass = card.type === 'analog' ? 'text-purple-400' : 
                                     card.type === 'digital' ? 'text-emerald-400' : 
                                     card.type === 'motor' ? 'text-orange-400' : 'text-blue-400';

                    if (card.type === 'analog' && card.mode === 'IN') {
                        bodyHTML = `<div class="flex flex-col items-center w-full gap-2"><div id="val-${card.id}" class="text-3xl font-mono ${colorClass} font-bold">0</div><div class="w-full h-24 bg-slate-900 rounded-lg p-1 border border-slate-700"><canvas id="chart-${card.id}"></canvas></div></div>`;
                    } else if (card.type === 'analog' && card.mode === 'OUT') {
                        bodyHTML = `<div class="flex flex-col items-center"><div id="val-${card.id}" class="text-3xl font-mono ${colorClass} font-bold mb-4">0</div><input type="range" min="0" max="1023" value="0" oninput="document.getElementById('val-${card.id}').innerText=this.value; sendRemoteCommand('${card.id}:'+this.value);" class="w-full"></div>`;
                    } else if (card.type === 'digital' && card.mode === 'IN') {
                        bodyHTML = `<div class="flex items-center gap-4 justify-center min-h-[70px]"><div class="text-[10px] font-bold text-slate-500 uppercase">State</div><div id="val-${card.id}" class="text-4xl font-mono text-slate-500 font-bold">0</div></div>`;
                    } else if (card.type === 'digital' && card.mode === 'OUT') {
                        bodyHTML = `<div class="flex justify-between gap-2 min-h-[70px] items-center w-full"><button onclick="sendRemoteCommand('${card.id}:0')" class="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300 font-bold shadow-inner border border-slate-600">LOW</button><button onclick="sendRemoteCommand('${card.id}:1')" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-bold shadow-lg border border-emerald-500">HIGH</button></div>`;
                    } else if (card.type === 'motor') {
                        bodyHTML = `
                            <div class="w-full flex flex-col items-center">
                                <div class="flex gap-2 w-full">
                                    <button onclick="sendRemoteCommand('${card.id}:-255')" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg">⏪ CCW</button>
                                    <button onclick="sendRemoteCommand('${card.id}:0')" class="flex-1 bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg">⏹️ STOP</button>
                                    <button onclick="sendRemoteCommand('${card.id}:255')" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-3 rounded-lg shadow-lg">CW ⏩</button>
                                </div>
                            </div>`;
                    } else if (card.type === 'servo') {
                        // Removed the large 90° readout, just the two buttons now
                        bodyHTML = `
                            <div class="w-full flex flex-col items-center justify-center h-full min-h-[70px]">
                                <div class="flex gap-2 w-full">
                                    <button id="btn-pos1-${card.id}" onclick="sendRemoteCommand('${card.id}:${card.pos1Val}')" class="flex-1 text-white text-sm font-bold py-3 rounded-lg shadow-lg border transition-all"></button>
                                    <button id="btn-pos2-${card.id}" onclick="sendRemoteCommand('${card.id}:${card.pos2Val}')" class="flex-1 text-white text-sm font-bold py-3 rounded-lg shadow-lg border transition-all"></button>
                                </div>
                            </div>`;
                    }

                    cardEl.innerHTML = `
                        <div class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center">
                            <div class="flex items-center gap-2"><span class="font-bold text-sm ${colorClass}">${card.id}</span><span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded text-slate-400 border border-slate-700">${card.mode || card.type.toUpperCase()}</span></div>
                            <span class="font-bold text-sm text-slate-300 truncate max-w-[120px]">${card.label}</span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-center bg-slate-800">${bodyHTML}</div>
                    `;
                    container.appendChild(cardEl);

                    if (card.type === 'analog' && card.mode === 'IN') initChart(card.id);
                }

                // Dynamic UI updates based on live data
                if (card.type === 'analog' && card.mode === 'IN') {
                    const valEl = document.getElementById(`val-${card.id}`);
                    if(valEl) { valEl.innerText = card.val; pushChartData(card.id, card.val); }
                } else if (card.type === 'digital' && card.mode === 'IN') {
                    const valEl = document.getElementById(`val-${card.id}`);
                    if(valEl) {
                        valEl.innerText = card.val;
                        valEl.className = card.val === 1 ? 'text-4xl font-mono text-emerald-400 font-bold drop-shadow-lg' : 'text-4xl font-mono text-slate-500 font-bold';
                    }
                } else if (card.type === 'servo') {
                    // Update Servo Buttons Colors Dynamically
                    const btn1 = document.getElementById(`btn-pos1-${card.id}`);
                    const btn2 = document.getElementById(`btn-pos2-${card.id}`);
                    
                    if (btn1 && btn2) {
                        // Ensure text is always up to date from Host
                        btn1.innerText = card.pos1Lbl;
                        btn2.innerText = card.pos2Lbl;
                        
                        // Check if current angle matches the preset angle
                        const isPos1 = Number(card.val) === Number(card.pos1Val);
                        const isPos2 = Number(card.val) === Number(card.pos2Val);

                        // Apply glowing blue if active, dull slate if inactive
                        btn1.className = `flex-1 text-white text-sm font-bold py-3 rounded-lg shadow-lg border transition-all ${isPos1 ? 'bg-blue-500 border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)] scale-[1.02]' : 'bg-slate-700 hover:bg-slate-600 border-slate-600'}`;
                        btn2.className = `flex-1 text-white text-sm font-bold py-3 rounded-lg shadow-lg border transition-all ${isPos2 ? 'bg-blue-500 border-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)] scale-[1.02]' : 'bg-slate-700 hover:bg-slate-600 border-slate-600'}`;
                    }
                }
            });
        }

        function initChart(id) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            sensorCharts[id] = new Chart(ctx, {
                type: 'line', data: { labels: [], datasets: [{ data: [], borderColor: '#c084fc', tension: 0.2, pointRadius: 0, borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { min: 0, max: 1023, display: false } } }
            });
        }

        function pushChartData(id, val) {
            if(!sensorCharts[id]) return;
            const chart = sensorCharts[id];
            chart.data.labels.push(''); chart.data.datasets[0].data.push(val);
            if(chart.data.labels.length > 20) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
            chart.update();
        }
    </script>
</body>
</html>
